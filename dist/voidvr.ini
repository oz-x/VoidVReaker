; VoidVReaker - VOID/BREAKER en realidad virtual (6DoF) - configuracion
; Los cambios se aplican al reiniciar el juego.

[VR]
; 0 = desactiva el mod por completo (el juego arranca normal, en plano).
Enabled=1
; Multiplicador sobre la resolucion por ojo que recomienda el visor. Mas bajo = mas fps.
; 0.75 da unos 72 fps con una RTX 4090 en Quest 3 via Virtual Desktop.
ResolutionScale=0.75
; Como se apunta: 2 = con el mando derecho (arma en la mano), 0 = con el stick (como en plano).
AimMode=2
; Mira VR donde van las balas (1 = si, 0 = no).
Reticle=1
; Giro con el stick derecho: velocidad en grados por segundo. Con SnapTurn mayor que 0 se gira
; a saltos de esos grados (por ejemplo 30), mas comodo si te mareas.
TurnSpeed=180
SnapTurn=0
; Posicion del arma en la mano (cm, punto de la vista del juego que se lleva al mando):
; mas GunOffsetForward = brazos mas atras; mas GunOffsetRight = mas a la izquierda;
; mas GunOffsetUp = mas abajo. GunYaw/GunPitch giran el arma (grados).
GunOffsetForward=33
GunOffsetRight=12
GunOffsetUp=-18
GunYaw=5
GunPitch=0
; 1 = solo se ve el arma en tu mano (sin brazos ni guantes). 0 = brazos del juego.
HideArms=1
; Con brazos visibles: distancia maxima (cm) que pueden separarse de su sitio. 0 = sin limite.
ArmsMaxOffset=0
; 1 = 6DoF (agacharte o inclinarte de verdad mueve la camara). 0 = solo rotacion.
PositionalTracking=1
; Unidades del juego por metro real. 0 = la escala del propio nivel (tamano real).
WorldScale=0
; Pantalla virtual de los menus: distancia y ancho en metros.
ScreenDistance=2.2
ScreenWidth=2.6
; Muestra el ojo izquierdo en la ventana del PC.
DesktopMirror=1

[Keys]
; Tecla para recentrar la vista (codigo virtual de Windows; 117 = F6). Tambien sirve
; mantener el boton Oculus/Meta del mando.
Recenter=117

[Debug]
; Solo para desarrollo: deja estos valores asi.
Trace=0
